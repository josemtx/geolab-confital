# El día 1 de cada mes genera el informe en PDF del mes anterior, lo guarda en public/informes/
# y vuelve a publicar la web para que aparezca en «Crear informe».
name: Informe mensual
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes del informe (AAAA-MM). Vacío = el mes anterior."
        required: false
permissions:
  contents: write
  actions: write
jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save puppeteer-core
      - name: Generar el PDF
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          MES="${{ inputs.mes }}"
          [ -z "$MES" ] && MES=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m)
          npx vite preview --port 4173 --strictPort &
          curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 2 http://localhost:4173/geolab-confital/datos/
          node datos/informe_pdf.mjs http://localhost:4173/geolab-confital/datos/ "$MES"
          echo "MES=$MES" >> "$GITHUB_ENV"
      - name: Guardar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/informes
          git commit -m "Informe mensual $MES"
          git push
          gh workflow run publicar.yml
